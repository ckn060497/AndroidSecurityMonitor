spring.application.name=phone-security-api
server.port=${PORT:8080}

# Development database
spring.datasource.url=jdbc:h2:file:./data/securitymonitor;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# PostgreSQL production override example:
# SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/securitymonitor
# SPRING_DATASOURCE_USERNAME=...
# SPRING_DATASOURCE_PASSWORD=...
# SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
