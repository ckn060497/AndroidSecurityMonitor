name: Build Spring Boot API

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check project
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "POM:"
          test -f pom.xml && echo "pom.xml FOUND" || echo "ERROR: pom.xml NOT FOUND"

      - name: Java version
        run: java -version

      - name: Maven version
        run: mvn -version

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Check JAR
        run: |
          echo "Target directory:"
          ls -lah target/
          echo "JAR files:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: phone-security-api-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
