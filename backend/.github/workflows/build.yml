
name: Build Spring Security API

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Show Maven version
        run: mvn -version

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/phone-security-api-1.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: phone-security-api-jar
          path: target/phone-security-api-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
