name: Build Spring Boot API

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check backend project
        run: |
          echo "Current directory:"
          pwd

          echo "Backend files:"
          ls -la

          echo "Checking pom.xml:"
          test -f pom.xml
          echo "pom.xml FOUND"

      - name: Java version
        run: java -version

      - name: Maven version
        run: mvn -version

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: |
          echo "Target directory:"
          ls -lah target/

          echo "Checking generated JAR:"
          test -f target/phone-security-api-1.0.0.jar

          echo "JAR FOUND:"
          ls -lh target/phone-security-api-1.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: phone-security-api-jar
          path: backend/target/phone-security-api-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
