name: Build Phone Security Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project
        working-directory: AndroidSecurityMonitor
        run: |
          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app

      - name: Build APK
        working-directory: AndroidSecurityMonitor
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-security-monitor-debug-apk
          path: AndroidSecurityMonitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
