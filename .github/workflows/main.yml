name: Build Phone Security Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Find Android project
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          if [ -f "settings.gradle" ]; then
            cd .
          elif [ -f "AndroidSecurityMonitor/settings.gradle" ]; then
            cd AndroidSecurityMonitor
          else
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "Building from:"
          pwd
          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-security-monitor-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            AndroidSecurityMonitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
