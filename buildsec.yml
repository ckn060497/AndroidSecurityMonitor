version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - java -version
      - mvn -version

  build:
    commands:
      - cd backend
      - mvn clean package -DskipTests

  post_build:
    commands:
      - cd ..
      - mkdir -p deploy
      - cp backend/target/phone-security-api-1.0.0.jar deploy/application.jar
      - echo "web: java -jar application.jar" > deploy/Procfile

artifacts:
  base-directory: deploy
  files:
    - '**/*'
